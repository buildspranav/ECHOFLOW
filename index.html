<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoFlow: A Music Streaming Platform</title>
  <script src="https://kit.fontawesome.com/d0b35162d4.js"></script>
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="main.css">
  <link rel="icon" type="image/svg+sml" href="echo-flow-favicon.svg">
</head>
<body>
  <header>
      <div id="logo-section" class="header">ECHOFLOW</div>
      <navigation id="search-section" class="header">
        <button class="nav-btn">Music</button>
        <button class="nav-btn">Trending</button>
        <button class="nav-btn">New Releases</button>
        <input id="search-btn" type="text" placeholder="Search">
      </navigation>
      <div id="profile-section" class="header">
        <div id="notification-container"><i class="fa-solid fa-bell icon"></i></div>
        <div id="setting-container"><i class="fa-solid fa-gear icon"></i></div>
        <div id="profile">
          <img id="profile-img" src="https://i.pinimg.com/736x/1b/2e/31/1b2e314e767a957a44ed8f992c6d9098.jpg">
          <div id="name">Frieda</div>
        </div>
      </div>
  </header>
  <main>
    <section id="left-navigation">
      <navigation id="browse">
        <div id="browse-heading">BROWSE</div>
        <button class="browse-btn active"><i class="fa-regular fa-house"></i>Home</button>
        <button class="browse-btn"><i class="fa-brands fa-itunes-note"></i>Albums</button>
        <button class="browse-btn"><i class="fa-solid fa-volume"></i>Genres</button>
        <button class="browse-btn"><i class="fa-solid fa-microphone"></i>Artists</button>


      </navigation>
      <navigation id="library">
        <div id="library-heading">LIBRARY</div>
        <button class="browse-btn"><i class="fa-solid fa-arrows-rotate"></i>Recent</button>
        <button class="browse-btn"><i class="fa-regular fa-heart"></i>Favourites</button>
        <button class="browse-btn"><i class="fa-solid fa-download"></i>Downloads</button>
      </navigation>
    </section>
    <section id="main-section">
      <div id="curated-playlists"></div>
      <div id="top-charts">
        <div>
          <p id="top-charts-heading">Top Charts</p>
        </div>
        <div class="top-chart-song-container">
          <p>1</p>
          <img class="song-poster" src="https://i1.sndcdn.com/artworks-mxzp2WLdcy4ydsBy-yUSjKg-t1080x1080.jpg">
          <div id="song-details">
            <div>MF Gabru!</div>
            <div>Karan Aujla</div>
          </div>
          <i class="fa-regular fa-circle-play"></i>
          <i class="fa-solid fa-plus"></i>
        </div>
        <div class="top-chart-song-container">
          <p>2</p>
          <img class="song-poster" src="https://i1.sndcdn.com/artworks-mxzp2WLdcy4ydsBy-yUSjKg-t1080x1080.jpg">
          <div id="song-details">
            <div>MF Gabru!</div>
            <div>Karan Aujla</div>
          </div>
          <i class="fa-regular fa-circle-play"></i>
          <i class="fa-solid fa-plus"></i>
        </div>
        <div class="top-chart-song-container">
          <p>3</p>
          <img class="song-poster" src="https://i1.sndcdn.com/artworks-mxzp2WLdcy4ydsBy-yUSjKg-t1080x1080.jpg">
          <div id="song-details">
            <div>MF Gabru!</div>
            <div>Karan Aujla</div>
          </div>
          <i class="fa-regular fa-circle-play"></i>
          <i class="fa-solid fa-plus"></i>
        </div>
      </div>
      <div id="trending-artists"></div>
      <div id="recommended-albums"></div>
    </section>
    <section id="current-song"></section>
  </main>
</body>
</html>
